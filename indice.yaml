# L'indice proposto: stesso stile della tesi, ma senza frontespizio né sommario.
# Non legge metadata.yaml, perché con un titolo Pandoc genererebbe il frontespizio.
from: markdown
pdf-engine: tectonic
number-sections: false
top-level-division: chapter
metadata:
  author: "Edoardo De Piccoli"
  lang: it-IT
  documentclass: report
  classoption: [a4paper, 12pt, oneside]
  geometry: [margin=3cm]
  colorlinks: true
