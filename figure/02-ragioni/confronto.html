<!doctype html>
<!--
	Mockup del confronto tra un assistente testuale (a sinistra) e ChatCart (a destra).
	Mostra solo il layout: barre grigie al posto del testo, nessuna parola.
	Il pannello di destra segue la struttura del widget di ChatCart (chat-widget/src/styles.css):
	misure in pixel reali, con il pannello allargato a 620 px perché la figura occupi tutta la
	larghezza del testo.
	Si esporta in confronto.pdf, largo quanto il testo (150 mm), con Chrome senza interfaccia:
	"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --no-pdf-header-footer \
		--print-to-pdf=confronto.pdf confronto.html
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Confronto</title>
<style>
	@page { size: 150mm 80mm; margin: 0; }
	:root {
		--testo: #18181b;
		--superficie: #f5f5f4;
		--bordo: #e4e4e2;
		--bordo-forte: #cfcfd3;
		--barra: #d4d4d8;
		--barra-chiara: #e7e7e5;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 150mm; height: 80mm; background: #ffffff; overflow: hidden; }
	/* 1286 x 680 px reali, ridotti a 150 mm x 80 mm: i due pannelli occupano tutta la larghezza. */
	.tela { transform: scale(0.4408); transform-origin: 0 0; width: 1286px; height: 680px; display: flex; justify-content: space-between; }

	/* Pannello del widget: 620 x 680 px. */
	.pannello {
		width: 620px; height: 680px; display: flex; flex-direction: column;
		border: 2px solid var(--bordo-forte); border-radius: 20px; background: #ffffff;
		overflow: hidden;
	}

	.intestazione {
		flex: none; display: flex; align-items: center; gap: 10px; height: 56px;
		padding: 0 18px 0 20px; border-bottom: 2px solid var(--bordo);
	}
	.marchio { width: 28px; height: 28px; border-radius: 50%; background: var(--testo); flex: none; }
	.intestazione .barra { width: 120px; height: 12px; background: var(--testo); opacity: 0.85; }
	.chiudi { margin-left: auto; width: 14px; height: 14px; position: relative; }
	.chiudi::before, .chiudi::after {
		content: ""; position: absolute; left: 6px; top: -2px; width: 2.5px; height: 18px;
		background: #71717a; border-radius: 2px; transform: rotate(45deg);
	}
	.chiudi::after { transform: rotate(-45deg); }

	.registro {
		flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;
	}

	.barra { height: 10px; border-radius: 5px; background: var(--barra); }

	/* Messaggio del cliente: fumetto scuro a destra, con la coda in basso a destra. */
	.cliente {
		align-self: flex-end; width: 56%; padding: 15px 16px; background: var(--testo);
		border-radius: 18px 18px 6px 18px; display: flex; flex-direction: column; gap: 9px;
	}
	.cliente .barra { background: #ffffff; opacity: 0.55; }

	/* Testo dell'assistente: senza fumetto nel widget, in un fumetto nel chatbot. */
	.assistente { display: flex; flex-direction: column; gap: 11px; padding: 4px 0; }
	.assistente.fumetto {
		width: 88%; padding: 18px; background: var(--superficie); border-radius: 18px 18px 18px 6px;
	}

	/* Carosello: due schede intere e la terza che affiora dal bordo del pannello. */
	.carosello { display: flex; flex-direction: column; gap: 14px; }
	.binario { display: flex; gap: 14px; margin-right: -24px; overflow: hidden; }
	.scheda {
		flex: 0 0 calc((100% - 38px) / 2 - 12px); border: 2px solid var(--bordo); border-radius: 16px; overflow: hidden;
		background: #ffffff;
	}
	.foto { aspect-ratio: 4 / 3; background: var(--superficie); position: relative; }
	.foto::before {
		content: ""; position: absolute; left: 50%; bottom: 34px; width: 50px; height: 84px;
		margin-left: -27px; border-radius: 12px; background: var(--barra);
	}
	.foto::after {
		content: ""; position: absolute; left: 50%; bottom: 118px; width: 26px; height: 17px;
		margin-left: -14px; border-radius: 4px; background: #a1a1aa;
	}
	.corpo { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
	.titolo { display: flex; flex-direction: column; gap: 8px; min-height: 30px; }
	.titolo .barra { background: #a1a1aa; }
	.acquisto { display: flex; align-items: center; justify-content: space-between; }
	.prezzo { width: 56px; height: 12px; border-radius: 6px; background: var(--testo); opacity: 0.8; }
	.aggiungi {
		width: 96px; height: 36px; border-radius: 18px; border: 2px solid var(--bordo-forte);
		display: flex; align-items: center; justify-content: center;
	}
	.aggiungi .barra { width: 52px; background: var(--testo); opacity: 0.75; }

	.controlli { display: flex; align-items: center; justify-content: space-between; }
	.controlli .barra { width: 40px; background: var(--barra-chiara); }
	.frecce { display: flex; gap: 8px; }
	.freccia {
		width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--bordo-forte);
		position: relative;
	}
	.freccia::after {
		content: ""; position: absolute; top: 10px; width: 8px; height: 8px;
		border: solid var(--testo); border-width: 0 0 2.5px 2.5px;
	}
	.freccia.indietro::after { left: 11px; transform: rotate(45deg); border-color: var(--barra); }
	.freccia.avanti::after { left: 8px; transform: rotate(-135deg); }

	/* Messaggi suggeriti: pillole allineate a destra, che vanno a capo. */
	.suggerimenti {
		display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding-left: 48px;
	}
	.suggerimento {
		height: 36px; padding: 0 16px; border: 2px solid var(--bordo); border-radius: 18px;
		display: flex; align-items: center;
	}
	.suggerimento .barra { background: #a1a1aa; }

	/* Campo di scrittura: pillola con il pulsante di invio rotondo. */
	.compositore { flex: none; padding: 10px 20px 20px; }
	.campo {
		height: 50px; border: 2px solid var(--bordo); border-radius: 25px;
		display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 18px;
	}
	.campo .barra { width: 150px; background: var(--barra-chiara); }
	.invio { width: 36px; height: 36px; border-radius: 50%; background: var(--testo); position: relative; }
	.invio::after {
		content: ""; position: absolute; left: 13px; top: 14px; width: 9px; height: 9px;
		border: solid #ffffff; border-width: 2.5px 2.5px 0 0; transform: rotate(-45deg);
	}
</style>
</head>
<body>
<div class="tela">

	<!-- Assistente testuale: la risposta è un unico blocco di testo. -->
	<div class="pannello">
		<div class="intestazione"><div class="marchio"></div><div class="barra"></div><div class="chiudi"></div></div>
		<div class="registro">
			<div class="cliente"><div class="barra"></div></div>
			<div class="assistente fumetto">
				<div class="barra"></div><div class="barra"></div><div class="barra" style="width:92%"></div>
				<div class="barra"></div><div class="barra" style="width:96%"></div><div class="barra"></div>
				<div class="barra" style="width:90%"></div><div class="barra"></div><div class="barra"></div>
				<div class="barra" style="width:94%"></div><div class="barra"></div><div class="barra" style="width:97%"></div>
				<div class="barra"></div><div class="barra" style="width:91%"></div><div class="barra"></div>
				<div class="barra"></div><div class="barra" style="width:95%"></div><div class="barra"></div>
				<div class="barra" style="width:60%"></div>
			</div>
		</div>
		<div class="compositore"><div class="campo"><div class="barra"></div><div class="invio"></div></div></div>
	</div>

	<!-- ChatCart: una frase breve, il carosello dei prodotti e i messaggi suggeriti. -->
	<div class="pannello">
		<div class="intestazione"><div class="marchio"></div><div class="barra"></div><div class="chiudi"></div></div>
		<div class="registro">
			<div class="cliente"><div class="barra"></div></div>
			<div class="assistente"><div class="barra" style="width:64%"></div></div>
			<div class="carosello">
				<div class="binario">
					<div class="scheda"><div class="foto"></div><div class="corpo">
						<div class="titolo"><div class="barra"></div><div class="barra" style="width:55%"></div></div>
						<div class="acquisto"><div class="prezzo"></div><div class="aggiungi"><div class="barra"></div></div></div>
					</div></div>
					<div class="scheda"><div class="foto"></div><div class="corpo">
						<div class="titolo"><div class="barra" style="width:85%"></div><div class="barra" style="width:40%"></div></div>
						<div class="acquisto"><div class="prezzo"></div><div class="aggiungi"><div class="barra"></div></div></div>
					</div></div>
					<div class="scheda"><div class="foto"></div><div class="corpo">
						<div class="titolo"><div class="barra"></div><div class="barra" style="width:60%"></div></div>
						<div class="acquisto"><div class="prezzo"></div><div class="aggiungi"><div class="barra"></div></div></div>
					</div></div>
				</div>
				<div class="controlli">
					<div class="barra"></div>
					<div class="frecce"><div class="freccia indietro"></div><div class="freccia avanti"></div></div>
				</div>
			</div>
			<div class="suggerimenti">
				<div class="suggerimento"><div class="barra" style="width:118px"></div></div>
				<div class="suggerimento"><div class="barra" style="width:84px"></div></div>
				<div class="suggerimento"><div class="barra" style="width:150px"></div></div>
			</div>
		</div>
		<div class="compositore"><div class="campo"><div class="barra"></div><div class="invio"></div></div></div>
	</div>

</div>
</body>
</html>
