[tools]
"github:tectonic-typesetting/tectonic" = "tectonic@0.17.0"

[tasks.anteprima]
description = "Compila in build/tesi.pdf senza aggiornare il PDF condiviso"
run = """
mkdir -p build
tectonic --keep-logs --synctex --outdir build tesi.tex
"""

[tasks.pdf]
description = "Compila e aggiorna tesi.pdf per la revisione"
depends = ["anteprima"]
run = "cp build/tesi.pdf tesi.pdf"
